<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Sozocraft app icon</title>
  <desc id="desc">An unmasked square app-icon source with structured prompt lines, an S-shaped divider, and an abstract image and video field.</desc>

  <defs>
    <clipPath id="icon-clip">
